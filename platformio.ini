; ELF74 - Projeto Final: Pac-Man controlado por inclinacao
; BlackPill STM32F411CE + FreeRTOS + ST7789 (240x240) + MPU6050
;
; Gravacao pelo USB-C (DFU). Serial de depuracao pelo mesmo USB-C (CDC).
;   pio run                -> compila
;   pio run -t upload      -> grava (placa em modo DFU, ver README)
;   pio device monitor     -> logs da placa

[platformio]
default_envs = blackpill_f411ce

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = cmsis

upload_protocol = dfu

lib_deps =
    https://github.com/hathach/tinyusb.git#0.21.0

lib_ldf_mode = deep+

; Mesma ABI de ponto flutuante em compilacao e ligacao (como na Aula 08)
build_unflags =
    -mfloat-abi=hard
    -mfloat-abi=soft
    -mfpu=fpv4-sp-d16

build_flags =
    -mcpu=cortex-m4
    -mthumb
    -mfloat-abi=softfp
    -mfpu=fpv4-sp-d16
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Iinclude
    '-DCFG_TUSB_CONFIG_FILE="tusb_config.h"'
    -DSTM32F411xE
    -DHSE_VALUE=25000000U
    -O2
    -Wall


; Os programas de teste em src/tests/ ficam fora do jogo
build_src_filter = +<*> -<tests/>

monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
monitor_echo = no
monitor_eol = CRLF

; Teste isolado do display (sem FreeRTOS/USB): pio run -e display_test -t upload
[env:display_test]
extends = env:blackpill_f411ce
lib_deps =
lib_ignore = FreeRTOS-Kernel
build_src_filter = -<*> +<board.c> +<clock.c> +<st7789.c> +<font5x7.c> +<tests/display_test.c>

; Placa de circuito impresso (hardware/): DC/RES trocados e display girado
; Gravar com: pio run -e pcb -t upload
[env:pcb]
extends = env:blackpill_f411ce
build_flags =
    ${env:blackpill_f411ce.build_flags}
    -DBOARD_PCB
